
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập nhúng CSS</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bài tập nhúng CSS</h1>

    <!-- Phần 1: Inline CSS -->
    <p style="color: red;">
        Phần 1: Đây là đoạn văn sử dụng Inline CSS, có màu đỏ.
    </p>

    <!-- Phần 2: Internal CSS -->
    <p class="internal">
        Phần 2: Đây là đoạn văn sử dụng Internal CSS, có màu xanh dương.
    </p>

    <!-- Phần 3: External CSS -->
    <p class="external">
        Phần 3: Đây là đoạn văn sử dụng External CSS, có màu xanh lá.
    </p>
</body>
</html>
